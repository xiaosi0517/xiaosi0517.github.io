<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 228" width="660" height="228" role="img">
<title>Low-correlation alignment</title>
<desc>A synthetic observation whose pattern is shifted relative to the reference frame. The deviation panel shows the offset, not a local blot.</desc>
<rect width="660" height="228" fill="#f4f8fa"/>
<defs>
  <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g" result="a">
      <feFuncA type="linear" slope="0.45"/>
    </feComponentTransfer>
  </filter>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#b86a2d"/></marker></defs>
<text x="16" y="26" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Expected</text>
<rect x="16" y="36" width="190" height="132" rx="8" fill="#ffffff" stroke="#d3dee6"/>
<text x="230" y="26" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Observed</text>
<rect x="230" y="36" width="190" height="132" rx="8" fill="#ffffff" stroke="#d3dee6"/>
<text x="444" y="26" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Departure</text>
<rect x="444" y="36" width="190" height="132" rx="8" fill="#ffffff" stroke="#d3dee6"/>
<rect x="28" y="48" width="166" height="108" rx="5" fill="#243038"/>
