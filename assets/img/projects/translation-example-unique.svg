<rect x="498" y="60" width="192" height="126" rx="6" fill="#fff" filter="url(#noise)" opacity=".58"/>
<text x="18" y="226" text-anchor="start" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Question: does a rare feature survive the learned prior?</text>
</svg>
