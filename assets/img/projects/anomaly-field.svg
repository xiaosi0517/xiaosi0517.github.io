<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img">
<title>Large inspection field</title>
<desc>A synthetic grid of noisy geometric images. Most tiles repeat the same line pattern. Four tiles are outlined: a bright patch, a dark gap, a gray wash, and an unexpected mark in the background.</desc>
<rect width="960" height="520" fill="#f4f8fa"/>
<defs>
  <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g" result="a">
      <feFuncA type="linear" slope="0.45"/>
    </feComponentTransfer>
  </filter>
</defs>
