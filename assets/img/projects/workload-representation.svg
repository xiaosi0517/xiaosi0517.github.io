<text x="48" y="350" text-anchor="start" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">Flat data is simple for a consumer that expects every object. Hierarchical data avoids copying geometry that never changes.</text></svg>