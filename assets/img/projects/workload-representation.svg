<text x="520" y="42" text-anchor="start" fill="#7257b5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Hierarchical</text>
<text x="48" y="66" text-anchor="start" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">Every copy stores the geometry</text>
