<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img">
<title>Flat copies versus hierarchical references</title><desc>Eight independent copies are contrasted with one reusable cell referenced six times.</desc>
<rect width="960" height="390" fill="#f4f8fa"/>
<defs>
  <marker id="go" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
