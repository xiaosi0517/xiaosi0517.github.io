<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="960" height="310" role="img">
<title>Engineering workflow for conditional translation</title>
<desc>A six-stage conceptual workflow moves from paired data and alignment through normalization, training, evaluation, and a downstream matching hypothesis.</desc>
<rect width="960" height="310" fill="#f4f8fa"/>

<defs>
  <filter id="noise" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".62" numOctaves="3" seed="9" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g"><feFuncA type="linear" slope=".38"/></feComponentTransfer>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="1.5"/></filter>
  <marker id="arrow-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0 0L8 4L0 8Z" fill="#2a6f97"/>
  </marker>
  <marker id="arrow-purple" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0 0L8 4L0 8Z" fill="#7257b5"/>
  </marker>
</defs>

<rect x="24" y="82" width="130" height="116" rx="12" fill="#fff" stroke="#2a6f97" stroke-width="1.5"/>
<text x="89" y="116" text-anchor="middle" fill="#2a6f97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">1</text>
<text x="89" y="143" text-anchor="middle" fill="#25313a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Paired data</text>
<text x="89" y="168" text-anchor="middle" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Pair views</text>
<path d="M156 140H175" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="179" y="82" width="130" height="116" rx="12" fill="#fff" stroke="#2a6f97" stroke-width="1.5"/>
<text x="244" y="116" text-anchor="middle" fill="#2a6f97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">2</text>
<text x="244" y="143" text-anchor="middle" fill="#25313a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Alignment</text>
<text x="244" y="168" text-anchor="middle" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Fix offset</text>
<path d="M311 140H330" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="334" y="82" width="130" height="116" rx="12" fill="#fff" stroke="#2a6f97" stroke-width="1.5"/>
<text x="399" y="116" text-anchor="middle" fill="#2a6f97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">3</text>
<text x="399" y="143" text-anchor="middle" fill="#25313a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Normalize</text>
<text x="399" y="168" text-anchor="middle" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Shared range</text>
<path d="M466 140H485" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="489" y="82" width="130" height="116" rx="12" fill="#fff" stroke="#7257b5" stroke-width="1.5"/>
<text x="554" y="116" text-anchor="middle" fill="#7257b5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">4</text>
<text x="554" y="143" text-anchor="middle" fill="#25313a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Train</text>
<text x="554" y="168" text-anchor="middle" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Fidelity + realism</text>
<path d="M621 140H640" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="644" y="82" width="130" height="116" rx="12" fill="#fff" stroke="#7257b5" stroke-width="1.5"/>
<text x="709" y="116" text-anchor="middle" fill="#7257b5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">5</text>
<text x="709" y="143" text-anchor="middle" fill="#25313a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Evaluate</text>
<text x="709" y="168" text-anchor="middle" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Metrics + review</text>
<path d="M776 140H795" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="799" y="82" width="130" height="116" rx="12" fill="#fff" stroke="#7257b5" stroke-width="1.5"/>
<text x="864" y="116" text-anchor="middle" fill="#7257b5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">6</text>
<text x="864" y="143" text-anchor="middle" fill="#25313a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Downstream</text>
<text x="864" y="168" text-anchor="middle" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Test matching</text>
<text x="24" y="38" text-anchor="start" fill="#25313a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Correspondence before capacity</text>
<text x="24" y="60" text-anchor="start" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">A sharp model cannot recover supervision that pairing and alignment have already broken.</text>
<path d="M24 234H936" stroke="#d3dee6" stroke-width="1"/>
<text x="24" y="270" text-anchor="start" fill="#25313a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Promotion question</text>
<text x="190" y="270" text-anchor="start" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Did structure improve on held-out pairs, or did the output merely become more convincing?</text>
</svg>
