<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" role="img">
<title>Why plausible is not the same as correct</title>
<desc>Four conceptual failure panels show a hallucinated repeat, a blurred boundary, a texture artifact, and a residual alignment offset.</desc>
<rect width="960" height="350" fill="#f4f8fa"/>

<defs>
  <filter id="noise" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".62" numOctaves="3" seed="9" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g"><feFuncA type="linear" slope=".38"/></feComponentTransfer>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="1.5"/></filter>
  <marker id="arrow-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0 0L8 4L0 8Z" fill="#2a6f97"/>
  </marker>
  <marker id="arrow-purple" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0 0L8 4L0 8Z" fill="#7257b5"/>
  </marker>
</defs>

<rect x="24" y="50" width="210" height="274" rx="12" fill="#fff" stroke="#d3dee6"/>
<text x="40" y="80" text-anchor="start" fill="#25313a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Hallucinated repeat</text>
<rect x="40" y="96" width="178" height="120" rx="6" fill="#34393d"/>
<g filter="url(#soft)" opacity=".86">
<path d="M54 114.0H204" stroke="#d9dde0" stroke-width="2.5"/>
<path d="M54 126.0H204" stroke="#d9dde0" stroke-width="2.5"/>
<path d="M54 138.0H204" stroke="#d9dde0" stroke-width="2.5"/>
<path d="M54 150.0H204" stroke="#d9dde0" stroke-width="2.5"/>
<path d="M54 162.0H204" stroke="#d9dde0" stroke-width="2.5"/>
<path d="M54 174.0H204" stroke="#d9dde0" stroke-width="2.5"/>
<path d="M54 186.0H204" stroke="#d9dde0" stroke-width="2.5"/></g>
<rect x="40" y="96" width="178" height="120" rx="6" fill="#fff" filter="url(#noise)" opacity=".42"/>
<path d="M58 156H200" stroke="#b86a2d" stroke-width="3"/>
<text x="40" y="244" text-anchor="start" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">A plausible line appears</text>
<text x="40" y="263" text-anchor="start" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">where the input had a</text>
<text x="40" y="282" text-anchor="start" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">gap.</text>
<rect x="256" y="50" width="210" height="274" rx="12" fill="#fff" stroke="#d3dee6"/>
<text x="272" y="80" text-anchor="start" fill="#25313a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Blurred boundary</text>
<rect x="272" y="96" width="178" height="120" rx="6" fill="#34393d"/>
<g filter="url(#soft)" opacity=".86">
<rect x="329.0" y="124.0" width="64" height="64" fill="none" stroke="#d9dde0" stroke-width="4"/>
<path d="M284 138.0H329.0M284 156.0H329.0M284 174.0H329.0M393.0 138.0H438M393.0 156.0H438M393.0 174.0H438" stroke="#7c6ad0" stroke-width="3"/>
<path d="M343.0 106V124.0M361.0 106V124.0M379.0 106V124.0M343.0 188.0V206M361.0 188.0V206M379.0 188.0V206" stroke="#8ea8e8" stroke-width="3"/></g>
<rect x="272" y="96" width="178" height="120" rx="6" fill="#fff" filter="url(#noise)" opacity=".42"/>
<rect x="326" y="126" width="70" height="60" fill="none" stroke="#b86a2d" stroke-width="2.5"/>
<text x="272" y="244" text-anchor="start" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Structure is aligned, but</text>
<text x="272" y="263" text-anchor="start" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">the edge is too soft.</text>
<rect x="488" y="50" width="210" height="274" rx="12" fill="#fff" stroke="#d3dee6"/>
<text x="504" y="80" text-anchor="start" fill="#25313a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Texture artifact</text>
<rect x="504" y="96" width="178" height="120" rx="6" fill="#34393d"/>
<g filter="url(#soft)" opacity=".86">
