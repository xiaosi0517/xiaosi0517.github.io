<path d="M278 142.3H442" stroke="#d9dde0" stroke-width="2.5"/>
<path d="M278 155.1H442" stroke="#d9dde0" stroke-width="2.5"/></g>
<rect x="264" y="60" width="192" height="126" rx="6" fill="#fff" filter="url(#noise)" opacity=".42"/>
