<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img">
<title>Parallel measurement of an image collection</title>
<desc>Synthetic images fan out to four workers that align and measure independently, then gather into one summary. Picture review is a separate, later step.</desc>
<rect width="960" height="440" fill="#f4f8fa"/>
<defs>
  <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g" result="a">
      <feFuncA type="linear" slope="0.45"/>
    </feComponentTransfer>
  </filter>
</defs>
