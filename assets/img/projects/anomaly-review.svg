<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img">
<title>Illustrative image review</title>
<desc>A synthetic review layout with signature filters, an expected pattern beside an observation, an outlined bright region, and a short flagged-region list. It is not a screenshot of internal software.</desc>
<rect width="960" height="520" fill="#f4f8fa"/>
<defs>
  <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g" result="a">
      <feFuncA type="linear" slope="0.45"/>
    </feComponentTransfer>
  </filter>
</defs>
<rect x="24" y="24" width="912" height="472" rx="14" fill="#ffffff" stroke="#d3dee6"/>
<text x="48" y="58" fill="#243038" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Image review</text>
<text x="168" y="58" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Illustrative interface, not internal software</text>
<rect x="48" y="88" width="150" height="32" rx="16" fill="#f4f8fa" stroke="#d3dee6"/>
<text x="123" y="109" text-anchor="middle" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">All</text>
<rect x="48" y="130" width="150" height="32" rx="16" fill="#e7f1f6" stroke="#2a6f97"/>
<text x="123" y="151" text-anchor="middle" fill="#2a6f97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Bright</text>
<rect x="48" y="172" width="150" height="32" rx="16" fill="#f4f8fa" stroke="#d3dee6"/>
<text x="123" y="193" text-anchor="middle" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Gray</text>
<rect x="48" y="214" width="150" height="32" rx="16" fill="#f4f8fa" stroke="#d3dee6"/>
<text x="123" y="235" text-anchor="middle" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Dark</text>
<rect x="48" y="256" width="150" height="32" rx="16" fill="#f4f8fa" stroke="#d3dee6"/>
<text x="123" y="277" text-anchor="middle" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Background</text>
<rect x="48" y="298" width="150" height="32" rx="16" fill="#f4f8fa" stroke="#d3dee6"/>
<text x="123" y="319" text-anchor="middle" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Low correlation</text>
<text x="230" y="86" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Expected</text>
<text x="490" y="86" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Observed</text>
<rect x="230" y="100" width="230" height="250" rx="5" fill="#243038"/>
<path d="M262.2 175.0H427.8" fill="none" stroke="#c5ced6" stroke-width="3.2" stroke-linecap="round"/>
<path d="M262.2 210.0H427.8" fill="none" stroke="#c5ced6" stroke-width="3.2" stroke-linecap="round"/>
<path d="M262.2 245.0H427.8" fill="none" stroke="#c5ced6" stroke-width="3.2" stroke-linecap="round"/>
<path d="M262.2 280.0H427.8" fill="none" stroke="#c5ced6" stroke-width="3.2" stroke-linecap="round"/>
<rect x="230" y="100" width="230" height="250" rx="5" fill="#ffffff" filter="url(#grain)" opacity="0.28"/>
<rect x="490" y="100" width="230" height="250" rx="5" fill="#243038"/>
<path d="M522.2 175.0H687.8" fill="none" stroke="#c5ced6" stroke-width="3.2" stroke-linecap="round"/>
<path d="M522.2 210.0H687.8" fill="none" stroke="#c5ced6" stroke-width="3.2" stroke-linecap="round"/>
<path d="M522.2 245.0H687.8" fill="none" stroke="#c5ced6" stroke-width="3.2" stroke-linecap="round"/>
<path d="M522.2 280.0H687.8" fill="none" stroke="#c5ced6" stroke-width="3.2" stroke-linecap="round"/>
<rect x="490" y="100" width="230" height="250" rx="5" fill="#ffffff" filter="url(#grain)" opacity="0.28"/>
<rect x="554.4" y="185.0" width="101.2" height="70.0" rx="2" fill="#f4f7f8"/>
<rect x="554.4" y="185.0" width="101.2" height="70.0" rx="3" fill="none" stroke="#b86a2d" stroke-width="2.4"/>
<text x="230" y="372" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Same geometry, same window.</text>
<rect x="748" y="88" width="164" height="286" rx="10" fill="#f4f8fa"/>
<text x="764" y="116" fill="#243038" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Flagged regions</text>
<text x="764" y="148" fill="#243038" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Bright</text>
<text x="764" y="166" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Upper lines</text>
<text x="764" y="200" fill="#243038" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Dark</text>
<text x="764" y="218" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">None in view</text>
<text x="764" y="252" fill="#243038" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Alignment</text>
<text x="764" y="270" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Holds</text>
<text x="48" y="430" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">The score is not the whole result. The pair of images shows what departed, and whether the alignment held.</text>
<text x="48" y="458" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Labels in this mockup are categories, not measured counts.</text>
</svg>
