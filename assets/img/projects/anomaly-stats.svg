<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img">
<title>Robust summary of region intensity</title>
<desc>A conceptual histogram. Most bars form one cluster. A shaded band marks the spread around the median. A dashed mean is pulled toward two separated orange bars.</desc>
<rect width="700" height="400" fill="#f4f8fa"/>
<defs>
  <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g" result="a">
      <feFuncA type="linear" slope="0.45"/>
    </feComponentTransfer>
  </filter>
</defs>
<text x="56" y="36" fill="#243038" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Region intensity across the collection</text>
<text x="56" y="58" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Conceptual shape. Bar heights are not measurements.</text>
<rect x="164.0" y="78" width="96.0" height="252" fill="#2a6f97" opacity="0.10"/>
<rect x="56" y="318" width="22" height="12" rx="3" fill="#8eacbc"/>
<rect x="86" y="302" width="22" height="28" rx="3" fill="#8eacbc"/>
<rect x="116" y="275" width="22" height="55" rx="3" fill="#8eacbc"/>
<rect x="146" y="220" width="22" height="110" rx="3" fill="#8eacbc"/>
<rect x="176" y="162" width="22" height="168" rx="3" fill="#8eacbc"/>
<rect x="206" y="120" width="22" height="210" rx="3" fill="#8eacbc"/>
<rect x="236" y="142" width="22" height="188" rx="3" fill="#8eacbc"/>
<rect x="266" y="210" width="22" height="120" rx="3" fill="#8eacbc"/>
<rect x="296" y="268" width="22" height="62" rx="3" fill="#8eacbc"/>
<rect x="326" y="300" width="22" height="30" rx="3" fill="#8eacbc"/>
<rect x="356" y="314" width="22" height="16" rx="3" fill="#8eacbc"/>
<rect x="386" y="320" width="22" height="10" rx="3" fill="#8eacbc"/>
<rect x="416" y="322" width="22" height="8" rx="3" fill="#8eacbc"/>
<rect x="446" y="324" width="22" height="6" rx="3" fill="#8eacbc"/>
<rect x="476" y="326" width="22" height="4" rx="3" fill="#8eacbc"/>
<rect x="566" y="252" width="22" height="78" rx="3" fill="#b86a2d"/>
<rect x="596" y="284" width="22" height="46" rx="3" fill="#b86a2d"/>
<path d="M217.0 78V330" stroke="#2a6f97" stroke-width="2.5"/>
<path d="M470.0 78V330" stroke="#b86a2d" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="189" y="70" fill="#2a6f97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Median</text>
<text x="448" y="70" fill="#b86a2d" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Mean</text>
<text x="56" y="358" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">lower intensity</text>
<text x="430" y="358" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">higher intensity</text>
<text x="566" y="236" fill="#b86a2d" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Departures</text>
</svg>
