<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="960" height="270" role="img">
<title>Workload generation pipeline</title><desc>Six conceptual stages run from configuration through synthesis, swath partitioning, generation, validation, and export.</desc>
<rect width="960" height="270" fill="#f4f8fa"/>
<defs>
  <marker id="go" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0 0L8 4L0 8Z" fill="#2a6f97"/>
  </marker>
</defs>
<text x="24" y="40" text-anchor="start" fill="#25313a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Configuration stays separate from execution</text>
<rect x="24" y="78" width="136" height="108" rx="12" fill="#fff" stroke="#2a6f97"/>
<text x="92" y="112" text-anchor="middle" fill="#2a6f97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">1</text>
<text x="92" y="138" text-anchor="middle" fill="#25313a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Config</text>
<text x="92" y="162" text-anchor="middle" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Rules</text>
<path d="M162 132H178" stroke="#2a6f97" stroke-width="2" marker-end="url(#go)"/>
<rect x="180" y="78" width="136" height="108" rx="12" fill="#fff" stroke="#2a6f97"/>
<text x="248" y="112" text-anchor="middle" fill="#2a6f97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">2</text>
<text x="248" y="138" text-anchor="middle" fill="#25313a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Synthesize</text>
<text x="248" y="162" text-anchor="middle" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Geometry</text>
<path d="M318 132H334" stroke="#2a6f97" stroke-width="2" marker-end="url(#go)"/>
<rect x="336" y="78" width="136" height="108" rx="12" fill="#fff" stroke="#2a6f97"/>
<text x="404" y="112" text-anchor="middle" fill="#2a6f97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">3</text>
<text x="404" y="138" text-anchor="middle" fill="#25313a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Partition</text>
<text x="404" y="162" text-anchor="middle" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Swaths</text>
<path d="M474 132H490" stroke="#2a6f97" stroke-width="2" marker-end="url(#go)"/>
<rect x="492" y="78" width="136" height="108" rx="12" fill="#fff" stroke="#7257b5"/>
<text x="560" y="112" text-anchor="middle" fill="#7257b5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">4</text>
<text x="560" y="138" text-anchor="middle" fill="#25313a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Generate</text>
<text x="560" y="162" text-anchor="middle" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Objects</text>
<path d="M630 132H646" stroke="#2a6f97" stroke-width="2" marker-end="url(#go)"/>
<rect x="648" y="78" width="136" height="108" rx="12" fill="#fff" stroke="#7257b5"/>
<text x="716" y="112" text-anchor="middle" fill="#7257b5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">5</text>
<text x="716" y="138" text-anchor="middle" fill="#25313a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Validate</text>
<text x="716" y="162" text-anchor="middle" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Relations</text>
<path d="M786 132H802" stroke="#2a6f97" stroke-width="2" marker-end="url(#go)"/>
<rect x="804" y="78" width="136" height="108" rx="12" fill="#fff" stroke="#7257b5"/>
<text x="872" y="112" text-anchor="middle" fill="#7257b5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">6</text>
<text x="872" y="138" text-anchor="middle" fill="#25313a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Export</text>
<text x="872" y="162" text-anchor="middle" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Formats</text>
<text x="24" y="230" text-anchor="start" fill="#5d6b76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">A swath is one spatial slice of the workload. Partitioning makes generation, checking, and retry local.</text></svg>